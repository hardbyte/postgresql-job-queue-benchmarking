[package]
name = "awa-bench"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "awa-bench"
path = "src/main.rs"

[features]
# awa 0.7 (main): find_jobs/count_jobs probes and the tag-index build.
# scripts/awa_operator_pin.sh switches the awa pin and enables it.
awa07 = []
# awa with ClientBuilder::max_concurrent_finalizes (awa PR #793): honours
# AWA_MAX_CONCURRENT_FINALIZES. Enable with AWA_BENCH_FEATURES=finalize_gate.
finalize_gate = []

[dependencies]
awa-model = { git = "https://github.com/hardbyte/awa", rev = "d73674aff1938e3acaa1c746b36cf3a6a591b772" }
awa-worker = { git = "https://github.com/hardbyte/awa", rev = "d73674aff1938e3acaa1c746b36cf3a6a591b772" }
awa-macros = { git = "https://github.com/hardbyte/awa", rev = "d73674aff1938e3acaa1c746b36cf3a6a591b772" }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "json", "migrate"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hdrhistogram = "7"
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics", "rt-tokio", "testing"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
