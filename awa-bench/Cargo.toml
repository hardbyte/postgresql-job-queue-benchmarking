[package]
name = "awa-bench"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "awa-bench"
path = "src/main.rs"

[dependencies]
awa-model = { git = "https://github.com/hardbyte/awa", rev = "1a53fd9ea2c6b5d852052771a8fe6b7fcdd2a278" }
awa-worker = { git = "https://github.com/hardbyte/awa", rev = "1a53fd9ea2c6b5d852052771a8fe6b7fcdd2a278" }
awa-macros = { git = "https://github.com/hardbyte/awa", rev = "1a53fd9ea2c6b5d852052771a8fe6b7fcdd2a278" }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "json", "migrate"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hdrhistogram = "7"
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics", "rt-tokio", "testing"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
