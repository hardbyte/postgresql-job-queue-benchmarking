[package]
name = "awa-bench"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "awa-bench"
path = "src/main.rs"

[dependencies]
# Pin all AWA crates together; each measured build records its resolved lock source.
awa-model = { git = "https://github.com/hardbyte/awa", rev = "94269f0a6d7cd64fdf065710185504d51ef42843" }
awa-worker = { git = "https://github.com/hardbyte/awa", rev = "94269f0a6d7cd64fdf065710185504d51ef42843" }
awa-macros = { git = "https://github.com/hardbyte/awa", rev = "94269f0a6d7cd64fdf065710185504d51ef42843" }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "json", "migrate"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hdrhistogram = "7"
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }

[features]
cron-protocol = []

[[bin]]
name = "awa-cron-protocol-bench"
path = "src/cron_protocol.rs"
required-features = ["cron-protocol"]
