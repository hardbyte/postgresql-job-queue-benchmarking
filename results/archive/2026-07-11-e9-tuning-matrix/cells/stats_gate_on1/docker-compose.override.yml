# E9 CONTROL override. pg_stat_statements only — the campaign-standard
# diagnostic override. All A/B "off" cells use this.
services:
  postgres:
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
