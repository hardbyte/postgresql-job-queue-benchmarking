[package]
name = "etl-cdc-bench"
version = "0.1.0"
edition = "2021"
description = "Supabase ETL CDC bench adapter: one etl pipeline per consumer, custom HTTP destination (docs/cdc-harness-design.md §2)"

[dependencies]
# Pre-1.0, git-only, no tags — pinned by commit (2026-09-30 HEAD).
etl = { git = "https://github.com/supabase/etl", rev = "9193912f88551aa44a06257c1f3836edd0b4601e" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
# Plain-http POSTs to the localhost receiver; no TLS stack needed.
reqwest = { version = "0.12", default-features = false }

[profile.release]
debug = false
