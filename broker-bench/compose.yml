name: broker-bench

x-kafgres: &kafgres
  image: broker-bench-kafgres:00168534-pg16.15
  build:
    context: .
    dockerfile: kafgres.Dockerfile
    args:
      PG_IMAGE: postgres:16.15-bookworm
  environment:
    POSTGRES_PASSWORD: postgres
  shm_size: 256mb
  deploy:
    resources:
      limits:
        cpus: "4"
        memory: 8G
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres && bash -c 'echo > /dev/tcp/127.0.0.1/9092'"]
    interval: 3s
    timeout: 5s
    retries: 30

services:
  kafgres-segment:
    <<: *kafgres
    ports:
      - "127.0.0.1:19092:9092"
      - "127.0.0.1:15416:5432"
    command:
      - postgres
      - -c
      - kafgres.storage_engine=segment
      - -c
      - kafgres.advertised_host=127.0.0.1
      - -c
      - kafgres.advertised_port=19092
      - -c
      - kafgres.fsync_before_ack=off

  kafgres-table:
    <<: *kafgres
    ports:
      - "127.0.0.1:19192:9092"
      - "127.0.0.1:15417:5432"
    command:
      - postgres
      - -c
      - kafgres.storage_engine=table
      - -c
      - kafgres.advertised_host=127.0.0.1
      - -c
      - kafgres.advertised_port=19192

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "127.0.0.1:19292:19292"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19292,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19292
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
