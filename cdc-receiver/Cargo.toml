[package]
name = "cdc-receiver"
version = "0.1.0"
edition = "2021"
description = "Harness-owned sink terminator + verifier for the CDC bench (docs/cdc-harness-design.md §3)"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hdrhistogram = "7"

[profile.release]
debug = false
